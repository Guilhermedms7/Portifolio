name: Publish portfolio and playground

on:
  push:
    branches:
      - main
    paths:
      - "dmsportifolio/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload portfolio site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dmsportifolio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
